name: Build SparkBuild

on:
  push:
    branches: [ main, master, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        id: build
        continue-on-error: true
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build_log.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt

      - name: Upload exe on success
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SparkBuild-Release
          path: build/bin/SparkBuild.exe

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Release artifact
        uses: actions/download-artifact@v4
        with:
          name: SparkBuild-Release
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/SparkBuild.exe
          generate_release_notes: true
