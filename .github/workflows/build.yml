name: Build SparkBuild

on:
  push:
    branches: [ main, master, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        id: build
        continue-on-error: true
        shell: cmd
        run: |
          cmake --build build --config Release --parallel > build_output.txt 2>&1
          type build_output.txt

      - name: Write error summary
        if: always()
        shell: pwsh
        run: |
          $content = Get-Content build_output.txt -Raw -ErrorAction SilentlyContinue
          if ($content) {
            $lines = $content -split "`n"
            $errors = $lines | Where-Object { $_ -match "error " -or $_ -match "fatal " -or $_ -match "LINK :" -or $_ -match ": error" }
            Write-Host "=== BUILD ERRORS ==="
            $errors | ForEach-Object { Write-Host $_ }
            Write-Host "=== END ERRORS ==="
            Write-Host ""
            Write-Host "=== LAST 50 LINES ==="
            $lines | Select-Object -Last 50 | ForEach-Object { Write-Host $_ }
            Write-Host "=== END ==="
            $errorText = ($errors -join "`n")
            "``````" + "`n" + $errorText + "`n" + "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload exe on success
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SparkBuild-Release
          path: build/bin/SparkBuild.exe

      - name: Check build result
        if: steps.build.outcome == 'failure'
        run: exit 1

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Release artifact
        uses: actions/download-artifact@v4
        with:
          name: SparkBuild-Release
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/SparkBuild.exe
          generate_release_notes: true
