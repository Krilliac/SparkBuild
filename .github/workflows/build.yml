name: Build SparkBuild

on:
  push:
    branches: [ main, master, Master, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, Master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SparkBuild-Release
          path: build/**/SparkBuild.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Release artifact
        uses: actions/download-artifact@v4
        with:
          name: SparkBuild-Release
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/SparkBuild.exe
          generate_release_notes: true

  # Rolling "latest" release on every push to Master
  release-latest:
    needs: build
    if: github.ref == 'refs/heads/Master' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Release artifact
        uses: actions/download-artifact@v4
        with:
          name: SparkBuild-Release
          path: release/

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SparkBuild (Latest Build)
          body: |
            Automatically built from the latest commit on Master.
            This release is updated on every push. Use a versioned tag
            (e.g. v1.0.0) if you need a stable reference.
          prerelease: true
          make_latest: false
          files: release/**/SparkBuild.exe
