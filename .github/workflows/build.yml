name: Build SparkBuild

on:
  push:
    branches: [ main, master, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Find and list exe
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Recurse -Filter "SparkBuild.exe" | ForEach-Object { Write-Host $_.FullName }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SparkBuild-Release
          path: build/**/SparkBuild.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Release artifact
        uses: actions/download-artifact@v4
        with:
          name: SparkBuild-Release
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/SparkBuild.exe
          generate_release_notes: true
